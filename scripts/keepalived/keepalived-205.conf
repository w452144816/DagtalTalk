vrrp_script chk_control {
    script "/etc/keepalived/check_control.sh"
    interval 2
    fall 3
    rise 2
}

vrrp_instance talk_control {
    state BACKUP            # 两边都 BACKUP + nopreempt：谁先起谁持有，主机恢复不抢回
    nopreempt
    interface eno1          # 205 上 <GPU1_LAN_IP> 所在网卡
    virtual_router_id 61
    priority 150
    advert_int 1
    authentication {
        auth_type PASS
        auth_pass talkvip1
    }
    virtual_ipaddress {
        <CONTROL_VIP>/24
    }
    track_script {
        chk_control
    }
}
